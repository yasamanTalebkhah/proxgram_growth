services:
  postgres:
    image: postgres:16-alpine
    container_name: proxgram_growth_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proxgram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proxgram_secret}
      POSTGRES_DB: ${POSTGRES_DB:-proxgram_growth}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxgram}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proxgram_growth_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: proxgram_growth_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  dashboard:
    build: .
    container_name: proxgram_growth_dashboard
    command: python -m uvicorn src.dashboard.app:app --host 0.0.0.0 --port 8080
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)\""]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
