services:
  postgres:
    image: postgres:16-alpine
    container_name: proxgram_growth_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proxgram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proxgram_secret}
      POSTGRES_DB: ${POSTGRES_DB:-proxgram_growth}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxgram}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proxgram_growth_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build: .
    container_name: proxgram_growth_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:
